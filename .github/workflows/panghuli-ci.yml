# Runs on PRs to dev: the Go tests for the code we patch, then the same image build as
# panghuli-release.yml without pushing, so a merge cannot publish an image that does not
# build. Shared steps live in .github/panghuli/prepare.sh.
name: panghuli ci

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panghuli-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/openlist

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go test
        run: go test -count=1 ./server/s3/... ./internal/op/... ./internal/db/... ./drivers/115_open/... ./drivers/local/...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: prep
        run: bash .github/panghuli/prepare.sh
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/panghuli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ steps.prep.outputs.tag }}
            WEB_VERSION=${{ steps.prep.outputs.web_version }}
            GIT_COMMIT=${{ steps.prep.outputs.commit }}
            BUILT_AT=${{ steps.prep.outputs.built_at }}
          tags: ${{ env.IMAGE }}:${{ steps.prep.outputs.tag }}
          cache-from: type=gha,scope=panghuli
